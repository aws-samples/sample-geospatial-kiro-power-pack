[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "geo-query"
version = "0.2.0"
description = "Pillar B (expansion) MCP server: spatial SQL execution via DuckDB Spatial and Athena."
requires-python = ">=3.10"
license = "MIT-0"
authors = [{ name = "Geospatial Power Pack Contributors" }]
keywords = ["kiro", "geospatial", "mcp", "spatial-sql", "duckdb", "athena"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "geo-common>=0.1",
    "httpx>=0.27",
    "pydantic>=2",
    "mcp>=1.0,<2",
]

[project.optional-dependencies]
duckdb = ["duckdb>=0.10"]
athena = ["boto3>=1.34"]
dev = ["pytest>=8.0,<9", "pytest-asyncio>=0.23,<1", "hypothesis>=6.100", "duckdb>=0.10"]

[project.scripts]
geo-query = "geo_query.server:main"

[tool.hatch.build.targets.wheel]
packages = ["geo_query"]
