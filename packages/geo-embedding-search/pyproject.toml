[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "geo-embedding-search"
version = "0.2.0"
description = "Pillar C (expansion) MCP server: embedding storage and similarity search (in-memory default; local LanceDB or managed Amazon OpenSearch backends)."
requires-python = ">=3.10"
license = "MIT-0"
authors = [{ name = "Geospatial Power Pack Contributors" }]
keywords = ["kiro", "geospatial", "mcp", "embedding-search", "embeddings", "opensearch"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "geo-common>=0.1",
    "httpx>=0.27",
    "pydantic>=2",
    "mcp>=1.0,<2",
]

[project.optional-dependencies]
# Local, embedded, durable vector store (no server to run).
lancedb = ["lancedb>=0.5", "pyarrow>=14"]
# Client for a managed/hosted OpenSearch (e.g. Amazon OpenSearch Service); the
# engine runs as a managed service, not locally.
opensearch = ["opensearch-py>=2.4,<4"]
dev = ["pytest>=8.0,<9", "pytest-asyncio>=0.23,<1", "hypothesis>=6.100"]

[project.scripts]
geo-embedding-search = "geo_embedding_search.server:main"

[tool.hatch.build.targets.wheel]
packages = ["geo_embedding_search"]
