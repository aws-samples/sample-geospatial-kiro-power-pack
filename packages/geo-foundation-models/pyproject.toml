[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "geo-foundation-models"
version = "0.2.0"
description = "Pillar C (MVP) MCP server: geospatial foundation-model embeddings, change detection, and segmentation (Clay, Prithvi-EO-2.0, SatCLIP, SAMGeo)."
requires-python = ">=3.10"
license = "MIT-0"
authors = [{ name = "Geospatial Power Pack Contributors" }]
keywords = ["kiro", "geospatial", "mcp", "embeddings", "foundation-models", "change-detection"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "geo-common>=0.1",
    "httpx>=0.27",
    "pydantic>=2",
    "numpy>=1.24",
    "mcp>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9", "pytest-asyncio>=0.23,<1", "hypothesis>=6.100"]
# Optional: enables the default S3 reader for `lookup_embeddings`, which reads
# the open LGND Clay v1.5 GeoParquet dataset over anonymous S3. Not needed when
# a custom embedding reader is injected, or for the rest of the server.
clay-lookup = ["pyarrow>=14"]

[project.scripts]
geo-foundation-models = "geo_foundation_models.server:main"

[tool.hatch.build.targets.wheel]
packages = ["geo_foundation_models"]
