[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "geo-ops"
version = "0.2.0"
description = "Pillar B (MVP) MCP server: CRS transforms, geometry validation, spatial joins, and overlays via PyProj and Shapely."
requires-python = ">=3.10"
license = "MIT-0"
authors = [{ name = "Geospatial Power Pack Contributors" }]
keywords = ["kiro", "geospatial", "mcp", "shapely", "pyproj", "geometry"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "geo-common>=0.1",
    "httpx>=0.27",
    "pydantic>=2",
    "shapely>=2",
    "pyproj>=3.6",
    "geopandas>=1",
    "mcp>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9", "pytest-asyncio>=0.23,<1", "hypothesis>=6.100"]

[project.scripts]
geo-ops = "geo_ops.server:main"

[tool.hatch.build.targets.wheel]
packages = ["geo_ops"]
