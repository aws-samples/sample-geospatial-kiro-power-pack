[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kiro-geospatial"
version = "0.2.0"
description = "Geospatial Power Pack Hub: onboarding dashboard, resource catalog, credential manager, and discover/process/analyze orchestration router."
license = "MIT-0"
requires-python = ">=3.10"
authors = [
    { name = "Geospatial Power Pack Contributors" },
]
keywords = [
    "kiro",
    "geospatial",
    "gis",
    "mcp",
    "power-hub",
    "orchestration",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "geo-common>=0.1",
    "httpx>=0.27,<1",
    "pydantic>=2,<3",
    "mcp>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
    "hypothesis>=6.100",
]

[project.scripts]
kiro-geospatial = "kiro_geospatial.server:main"

[tool.hatch.build.targets.wheel]
packages = ["kiro_geospatial"]
