[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "geo-warehouse"
version = "0.2.0"
description = "Credentialed (first expansion, Pillar B-class) MCP server: warehouse-scale spatial SQL across BigQuery, Snowflake, Redshift, and Databricks."
requires-python = ">=3.10"
license = "MIT-0"
authors = [{ name = "Geospatial Power Pack Contributors" }]
keywords = ["kiro", "geospatial", "mcp", "warehouse", "spatial-sql", "bigquery"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "geo-common>=0.1",
    "httpx>=0.27",
    "pydantic>=2",
    "mcp>=1.0,<2",
]

[project.optional-dependencies]
bigquery = ["google-cloud-bigquery>=3.11,<4"]
redshift = ["redshift-connector>=2.0,<3"]
snowflake = ["snowflake-connector-python>=3.6,<4"]
databricks = ["databricks-sql-connector>=3.0,<5"]
dev = ["pytest>=8.0,<9", "pytest-asyncio>=0.23,<1", "hypothesis>=6.100"]

[project.scripts]
geo-warehouse = "geo_warehouse.server:main"

[tool.hatch.build.targets.wheel]
packages = ["geo_warehouse"]
